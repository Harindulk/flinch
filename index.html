      <noscript>
        <h1>Flinch: see the moment your playtester flinched</h1>
        <p>Flinch is a free playtest recorder for game developers. It records your game window and your tester's webcam in one Chrome tab, learns the tester's resting face in ten seconds, and pins every clear facial-expression change: possible frustration and possible delight. Click a pin to replay the game and the face from three seconds before. Export a Markdown fix list, the recordings and a highlight reel. Everything runs locally; nothing is uploaded.</p>
        <p>Flinch needs JavaScript, desktop Chrome or Edge, and a webcam. Source code: <a href="https://github.com/Harindulk/flinch">github.com/Harindulk/flinch</a>.</p>
